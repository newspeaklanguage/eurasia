<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newspeak Documents on Eurasia</title>
<!-- The document viewer (AmpleforthViewer) on Eurasia: the page psoup's viewer
     is (primordialsoup.html?snapshot=AmpleforthViewer.vfuel&docName=...), with
     the viewer's image (viewer/base.eus, built by scripts/ide.sh) and the VM.
     The viewer shows the document named by the docName query parameter,
     fetched from this page's server as <docName>.zip; docName may be a path
     (menus/MenuDirectory). The libraries are the IDE's, staged beside this page
     by scripts/ide.sh. -->
<script src="vendor/buffer-6.0.3.bundle.min.js"></script>
<script>window.Buffer = window.buffer.Buffer;</script>
<script src="CodeMirror/lib/codemirror.js"></script>
<link rel="stylesheet" href="CodeMirror/lib/codemirror.css">
<script src="CodeMirror/addon/display/autorefresh.js"></script>
<script src="jszip.min.js"></script>
<script src="vendor/isomorphic-git-1.38.4.umd.min.js"></script>
<script src="vendor/lightning-fs-4.6.2.min.js"></script>
<script src="vendor/isomorphic-git-1.38.4-http-web.umd.js"></script>
<script src="vendor/diff_match_patch-2019-07.js"></script>
<script src="custom-post.js"></script>
<style>
body { margin: 0; background: #fff; }
</style>
</head>
<body>
<script type="module">
  import { run } from './eurasia.mjs';
  const fetchBytes = async (url) => {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`cannot fetch ${url}: ${response.status}`);
    return new Uint8Array(await response.arrayBuffer());
  };
  try {
    const [wasm, snapshot] = await Promise.all([fetchBytes('eurasia_web.wasm'), fetchBytes('viewer/base.eus')]);
    // ?interpret runs without the compiler.
    const jit = new URLSearchParams(location.search).has('interpret') ? 0 : 1;
    const result = await run(wasm, snapshot, { print: (line) => console.log(line), jit });
    console.log('eurasia:', result.status === 'exited' ? `exited ${result.code}` : 'idle');
  } catch (e) {
    console.error('eurasia:', e.message);
    document.body.append(`Eurasia failed: ${e.message}`);
  }
</script>
</body>
</html>
