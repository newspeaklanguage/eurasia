<!-- Newspeak under Croquet on Eurasia: the page psoup's is
     (croquetpsoup.html?snapshot=CroquetAmpleforthViewer.vfuel or
     CroquetHopscotchWebIDE.vfuel), with an image built on the Croquet platform
     (newspeak/platform/Eurasia/CroquetRuntime.ns; scripts/build.sh
     croquet-viewer croquet-ide) and Eurasia's VM.

       croquet.html?app=viewer&docName=<document>   (the default app)
       croquet.html?app=ide
         &sessionId=<fresh name>&pwd=<anything>&appId=<reverse DNS>
         &apiKey=none&reflector=ws://localhost:9090[&files=<file server>]

     The Croquet parameters are psoup's (newspeak/CROQUET_NOTES.md): run the
     reflector with newspeak/tool/run-croquet-reflector.sh, and use a fresh
     sessionId per test. ?interpret runs without the compiler.

     Croquet's client (croquet.min.js, the local build of the patched fork) and
     the Croquet support script (croquet-glue.js: the JS deploy's copy, made by
     newspeak/tool/mirror-croquet-glue.py --emit from
     primordialsoup/meta/croquet-post.js) are staged beside this page by
     scripts/ide.sh. The support script joins the session and only then loads
     nsProgramSrc, croquet-boot.js, which starts Eurasia: Newspeak's boot
     reads the view the join makes (HopscotchShell>>setupCroquetView). -->
